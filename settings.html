<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keffaine</title>
<link rel="stylesheet" href="style.css">
<style>
	html,
	body {
		background: #0a0c11;
		min-height: 100%;
	}

	body {
		font-family: KfMono, ui-monospace, monospace;
		color: var(--txt);
		font-size: 13px;
		padding: 0 0 108px;
	}

	.st {
		max-width: 560px;
		margin: 0 auto;
		padding: 18px 16px 0;
	}

	/* ------------------------------------------------------------- header */
	.st__head {
		display: flex;
		align-items: center;
		gap: 12px;
		padding: 6px 2px 18px;
	}

	.st__logo {
		width: 46px;
		height: 46px;
		border-radius: 12px;
		border: 1px solid var(--line-2);
		flex: 0 0 auto;
	}

	.st__brand {
		font-size: 21px;
		font-weight: 700;
		letter-spacing: 0.06em;
		line-height: 1.15;
	}

	.st__sub {
		font-size: 10px;
		color: var(--txt-dim);
		letter-spacing: 0.22em;
		text-transform: uppercase;
	}

	/* --------------------------------------------------------------- cards */
	.st__card {
		background: rgba(19, 22, 30, 0.72);
		border: 1px solid var(--line);
		border-radius: 12px;
		padding: 4px 14px 12px;
		margin-bottom: 12px;
		backdrop-filter: var(--glass);
		-webkit-backdrop-filter: var(--glass);
	}

	.st__title {
		font-size: 10px;
		letter-spacing: 0.2em;
		text-transform: uppercase;
		color: var(--acc);
		padding: 12px 0 8px;
	}

	.st__row {
		display: flex;
		align-items: center;
		gap: 10px;
		min-height: 38px;
		padding: 3px 0;
		border-top: 1px solid rgba(169, 205, 255, 0.05);
	}

	.st__row:first-of-type {
		border-top: 0;
	}

	.st__lbl {
		flex: 1 1 auto;
		min-width: 0;
	}

	.st__hint {
		display: block;
		font-size: 10px;
		color: var(--txt-dim-2);
		margin-top: 2px;
		letter-spacing: 0.02em;
	}

	.st__val {
		flex: 0 0 auto;
		font-size: 12px;
		color: var(--acc);
		min-width: 52px;
		text-align: right;
	}

	/* ------------------------------------------------------------ controls */
	.st__slide {
		flex: 0 0 40%;
	}

	input[type="range"] {
		-webkit-appearance: none;
		appearance: none;
		width: 100%;
		height: 3px;
		border-radius: 2px;
		background: rgba(255, 255, 255, 0.1);
		outline: 0;
	}

	input[type="range"]::-webkit-slider-thumb {
		-webkit-appearance: none;
		width: 14px;
		height: 14px;
		border-radius: 50%;
		background: #dbe3f0;
		border: 2px solid #0a0c11;
		box-shadow: 0 0 0 1px var(--acc);
	}

	input[type="text"] {
		flex: 0 0 46%;
		background: var(--ctrl);
		border: 1px solid var(--line-2);
		border-radius: 6px;
		color: var(--txt);
		font: inherit;
		font-size: 12px;
		padding: 7px 9px;
		outline: 0;
		min-width: 0;
	}

	input[type="text"]:focus {
		border-color: var(--acc);
	}

	.st__sw {
		flex: 0 0 auto;
		width: 40px;
		height: 22px;
		border-radius: 11px;
		background: rgba(255, 255, 255, 0.08);
		border: 1px solid var(--line-2);
		position: relative;
		cursor: pointer;
		transition: background 0.18s ease;
	}

	.st__sw i {
		position: absolute;
		top: 3px;
		left: 3px;
		width: 14px;
		height: 14px;
		border-radius: 50%;
		background: var(--txt-dim);
		transition: transform 0.18s ease, background 0.18s ease;
	}

	.st__sw.on {
		background: rgba(169, 205, 255, 0.22);
	}

	.st__sw.on i {
		transform: translateX(18px);
		background: var(--acc);
	}

	.st__seg {
		flex: 0 0 auto;
		display: flex;
		background: rgba(255, 255, 255, 0.04);
		border: 1px solid var(--line);
		border-radius: 7px;
		padding: 2px;
		gap: 2px;
	}

	.st__seg button {
		font: inherit;
		font-size: 11px;
		color: var(--txt-dim);
		background: none;
		border: 0;
		border-radius: 5px;
		padding: 5px 11px;
		cursor: pointer;
	}

	.st__seg button.on {
		background: rgba(169, 205, 255, 0.14);
		color: var(--txt);
	}

	/* --------------------------------------------------------------- alert */
	.st__warn {
		display: none;
		align-items: center;
		gap: 10px;
		background: rgba(255, 107, 107, 0.09);
		border: 1px solid rgba(255, 107, 107, 0.32);
		border-radius: 10px;
		padding: 11px 13px;
		margin-bottom: 12px;
		font-size: 12px;
		line-height: 1.45;
	}

	.st__warn.show {
		display: flex;
	}

	.st__warn button {
		flex: 0 0 auto;
		font: inherit;
		font-size: 11px;
		color: #0a0c11;
		background: #ff9b9b;
		border: 0;
		border-radius: 6px;
		padding: 7px 12px;
		cursor: pointer;
	}

	/* ------------------------------------------------------------ bottom bar */
	.st__bar {
		position: fixed;
		left: 0;
		right: 0;
		bottom: 0;
		display: flex;
		gap: 10px;
		padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
		background: rgba(10, 12, 17, 0.92);
		border-top: 1px solid var(--line);
		backdrop-filter: var(--glass);
		-webkit-backdrop-filter: var(--glass);
	}

	.st__bar button {
		flex: 1 1 0;
		font: inherit;
		font-size: 13px;
		letter-spacing: 0.04em;
		padding: 13px 10px;
		border-radius: 9px;
		border: 1px solid var(--line-2);
		background: var(--ctrl);
		color: var(--txt);
		cursor: pointer;
	}

	.st__bar button.primary {
		border-color: transparent;
		background: linear-gradient(90deg, #a9cdff 0%, #98a3b3 38.5%, #a9cdff 100%);
		color: #0a0c11;
		font-weight: 700;
	}

	.st__bar button.stop {
		flex: 0 0 34%;
	}

	.st__state {
		text-align: center;
		font-size: 10px;
		letter-spacing: 0.18em;
		text-transform: uppercase;
		color: var(--txt-dim-2);
		padding: 4px 0 10px;
	}

	.st__state b {
		color: #7fe3a1;
		font-weight: 400;
	}
</style>
</head>
<body>
<div class="st">
	<header class="st__head">
		<img class="st__logo" src="img/logo_rounded.png" alt="">
		<div>
			<div class="st__brand grad">Keffaine</div>
			<div class="st__sub">Showcase overlay</div>
		</div>
	</header>

	<div class="st__warn" id="warn">
		<span id="warnText">Разрешение «Поверх других приложений» не выдано.</span>
		<button id="warnBtn">Выдать</button>
	</div>

	<div id="form"></div>

	<div class="st__state" id="state"></div>
</div>

<div class="st__bar">
	<button class="primary" id="btnStart">Запустить оверлей</button>
	<button class="stop" id="btnStop">Стоп</button>
</div>

<script>
(function () {
	"use strict";

	/* browser fallback so this page can be opened outside the app too */
	var APP = window.KfApp || {
		_c: "{}",
		getConfig: function () {
			return this._c;
		},
		save: function (j) {
			this._c = j;
		},
		canOverlay: function () {
			return true;
		},
		requestOverlay: function () {},
		isRunning: function () {
			return false;
		},
		start: function () {},
		stop: function () {},
		resetState: function () {}
	};

	var DEF = {
		startDelaySec: 3,
		showIntro: true,
		introDelayMs: 500,
		user: "wruhe",
		days: 15,
		hwid: "7F2A-91C4-D08B",
		avatar: 1,
		fpsMin: 118,
		fpsMax: 144,
		pingMin: 12,
		pingMax: 38,
		wmX: 12,
		wmY: 12,
		wmScale: 1,
		menuScale: 1
	};

	var C = {};
	try {
		C = JSON.parse(APP.getConfig() || "{}") || {};
	} catch (e) {
		C = {};
	}
	for (var k in DEF) if (C[k] == null) C[k] = DEF[k];

	var FIELDS = [
		{ group: "Оверлей" },
		{
			k: "startDelaySec",
			t: "range",
			label: "Задержка запуска",
			hint: "Сколько ждать после нажатия «Запустить»",
			min: 0,
			max: 60,
			step: 1,
			unit: " сек"
		},
		{ k: "showIntro", t: "check", label: "Интро Keffaine", hint: "Анимированный текст в центре экрана" },
		{ k: "introDelayMs", t: "range", label: "Задержка интро", min: 0, max: 3000, step: 50, unit: " мс" },

		{ group: "Профиль" },
		{ k: "user", t: "text", label: "Никнейм" },
		{ k: "hwid", t: "text", label: "HWID" },
		{ k: "days", t: "range", label: "Days left", min: 1, max: 365, step: 1, unit: " д" },
		{ k: "avatar", t: "seg", label: "Аватарка", opts: [[1, "Рандом"], [2, "Логотип"]] },

		{ group: "Фейковые показатели" },
		{ k: "fpsMin", t: "range", label: "FPS минимум", min: 30, max: 480, step: 1 },
		{ k: "fpsMax", t: "range", label: "FPS максимум", min: 30, max: 480, step: 1 },
		{ k: "pingMin", t: "range", label: "Ping минимум", min: 1, max: 300, step: 1 },
		{ k: "pingMax", t: "range", label: "Ping максимум", min: 1, max: 300, step: 1 },

		{ group: "Размер и позиция" },
		{ k: "wmX", t: "range", label: "Вотермарк X", hint: "Его ещё можно просто перетащить пальцем", min: 0, max: 900, step: 2 },
		{ k: "wmY", t: "range", label: "Вотермарк Y", min: 0, max: 900, step: 2 },
		{ k: "wmScale", t: "range", label: "Масштаб вотермарка", min: 0.6, max: 2, step: 0.05, fixed: 2, unit: "x" },
		{ k: "menuScale", t: "range", label: "Масштаб меню", min: 0.5, max: 1.6, step: 0.05, fixed: 2, unit: "x" }
	];

	function el(tag, cls, txt) {
		var n = document.createElement(tag);
		if (cls) n.className = cls;
		if (txt != null) n.textContent = txt;
		return n;
	}

	var saveTimer = null;
	function save() {
		clearTimeout(saveTimer);
		saveTimer = setTimeout(function () {
			try {
				APP.save(JSON.stringify(C));
			} catch (e) {}
		}, 120);
	}

	function label(f) {
		var l = el("div", "st__lbl");
		l.appendChild(document.createTextNode(f.label));
		if (f.hint) l.appendChild(el("span", "st__hint", f.hint));
		return l;
	}

	var form = document.getElementById("form");
	var card = null;

	FIELDS.forEach(function (f) {
		if (f.group) {
			card = el("section", "st__card");
			card.appendChild(el("div", "st__title", f.group));
			form.appendChild(card);
			return;
		}

		var row = el("div", "st__row");
		row.appendChild(label(f));

		if (f.t === "range") {
			var out = el("div", "st__val");
			var box = el("div", "st__slide");
			var r = document.createElement("input");
			r.type = "range";
			r.min = f.min;
			r.max = f.max;
			r.step = f.step;
			r.value = C[f.k];
			var show = function () {
				var v = parseFloat(r.value);
				out.textContent = (f.fixed ? v.toFixed(f.fixed) : v) + (f.unit || "");
			};
			r.addEventListener("input", function () {
				C[f.k] = f.fixed ? parseFloat(r.value) : parseInt(r.value, 10);
				show();
				save();
			});
			show();
			box.appendChild(r);
			row.appendChild(box);
			row.appendChild(out);
		} else if (f.t === "text") {
			var i = document.createElement("input");
			i.type = "text";
			i.value = C[f.k];
			i.spellcheck = false;
			i.addEventListener("input", function () {
				C[f.k] = i.value;
				save();
			});
			row.appendChild(i);
		} else if (f.t === "check") {
			var sw = el("div", "st__sw" + (C[f.k] ? " on" : ""));
			sw.appendChild(el("i"));
			sw.addEventListener("click", function () {
				C[f.k] = !C[f.k];
				sw.classList.toggle("on", !!C[f.k]);
				save();
			});
			row.appendChild(sw);
		} else if (f.t === "seg") {
			var seg = el("div", "st__seg");
			f.opts.forEach(function (o) {
				var b = el("button", C[f.k] === o[0] ? "on" : "", o[1]);
				b.addEventListener("click", function () {
					C[f.k] = o[0];
					Array.prototype.forEach.call(seg.children, function (c) {
						c.className = "";
					});
					b.className = "on";
					save();
				});
				seg.appendChild(b);
			});
			row.appendChild(seg);
		}

		card.appendChild(row);
	});

	/* ------------------------------------------------------------ actions */
	var warn = document.getElementById("warn");
	var stateLine = document.getElementById("state");

	function refresh() {
		var ok = true;
		try {
			ok = !!APP.canOverlay();
		} catch (e) {}
		warn.classList.toggle("show", !ok);

		var run = false;
		try {
			run = !!APP.isRunning();
		} catch (e) {}
		stateLine.innerHTML = run ? "Оверлей <b>работает</b>" : "Оверлей остановлен";
	}
	window.kfRefresh = refresh;

	document.getElementById("warnBtn").addEventListener("click", function () {
		try {
			APP.requestOverlay();
		} catch (e) {}
	});

	document.getElementById("btnStart").addEventListener("click", function () {
		var ok = true;
		try {
			ok = !!APP.canOverlay();
		} catch (e) {}
		if (!ok) {
			warn.classList.add("show");
			try {
				APP.requestOverlay();
			} catch (e) {}
			return;
		}
		try {
			APP.start(JSON.stringify(C));
		} catch (e) {}
		setTimeout(refresh, 400);
	});

	document.getElementById("btnStop").addEventListener("click", function () {
		try {
			APP.stop();
		} catch (e) {}
		setTimeout(refresh, 400);
	});

	refresh();
})();
</script>
</body>
</html>
